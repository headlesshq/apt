name: Build repository

# Builds the signed apt repository from the latest HeadlessMc releases and installs headlessmc from it
# in Debian and Ubuntu containers on amd64 and arm64. Called by update-headlessmc.yml and tests.yml,
# which decide whether the tested repository gets deployed.

on:
  workflow_call:
    inputs:
      tag:
        description: Release tag of headlesshq/headlessmc to include even if it is not one of the latest releases
        type: string
        default: ''
      keep:
        description: Number of the latest releases the repository contains
        type: number
        default: 2
      skip-unchanged:
        description: Skip building if the deployed repository already contains exactly these releases
        type: boolean
        default: false
    outputs:
      changed:
        description: Whether the repository has been built, false if skip-unchanged skipped it
        value: ${{ jobs.build.outputs.changed }}
      releases:
        description: The releases in the repository, newest first, separated by spaces
        value: ${{ jobs.build.outputs.releases }}
      ephemeral:
        description: Whether the repository has been signed with a throwaway key, because APT_SIGNING_KEY is not set
        value: ${{ jobs.build.outputs.ephemeral }}

permissions:
  contents: read

env:
  APT_URL: https://headlesshq.github.io/apt/
  NFPM_RELEASE: 2.48.0
  NFPM_SHA256: 6d7f9a28b2f397934403950fcbba83f598b08d02edbe79a0815b3b4897341750

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.select.outputs.changed }}
      releases: ${{ steps.select.outputs.releases }}
      ephemeral: ${{ steps.build.outputs.ephemeral }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Select releases
        id: select
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          KEEP: ${{ inputs.keep }}
          TAG: ${{ inputs.tag }}
          SKIP_UNCHANGED: ${{ inputs.skip-unchanged }}
        run: |
          bash .github/scripts/select-headlessmc-releases.sh "$TAG" > "$RUNNER_TEMP/releases.txt"
          echo "releases=$(paste -sd' ' "$RUNNER_TEMP/releases.txt")" >> "$GITHUB_OUTPUT"
          # fails while Pages is not set up yet, which counts as changed
          if [[ "$SKIP_UNCHANGED" == "true" ]] \
            && curl -fsSL --retry 3 "${APT_URL}releases.txt" -o "$RUNNER_TEMP/deployed.txt" \
            && cmp -s "$RUNNER_TEMP/releases.txt" "$RUNNER_TEMP/deployed.txt"; then
            echo "The deployed repository is up to date: $(paste -sd' ' "$RUNNER_TEMP/releases.txt")"
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      # only used for releases that have no deb assets yet
      - name: Install nfpm
        if: steps.select.outputs.changed == 'true'
        run: |
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/nfpm.tar.gz" \
            "https://github.com/goreleaser/nfpm/releases/download/v${NFPM_RELEASE}/nfpm_${NFPM_RELEASE}_Linux_x86_64.tar.gz"
          echo "$NFPM_SHA256  $RUNNER_TEMP/nfpm.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/nfpm.tar.gz" -C "$RUNNER_TEMP" nfpm
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"

      - name: Build repository
        id: build
        if: steps.select.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APT_SIGNING_KEY: ${{ secrets.APT_SIGNING_KEY }}
          APT_SIGNING_PASSPHRASE: ${{ secrets.APT_SIGNING_PASSPHRASE }}
          ALLOW_EPHEMERAL_KEY: 'true'
        run: |
          mapfile -t releases < "$RUNNER_TEMP/releases.txt"
          bash .github/scripts/collect-headlessmc.sh site "${releases[@]}"
          bash .github/scripts/build-repository.sh site "${releases[@]}"
          if [[ -z "$APT_SIGNING_KEY" ]]; then
            echo "::warning::APT_SIGNING_KEY is not set, the repository has been signed with a throwaway key and cannot be deployed"
            echo "ephemeral=true" >> "$GITHUB_OUTPUT"
          else
            echo "ephemeral=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload repository
        if: steps.select.outputs.changed == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: apt-repository
          path: site
          if-no-files-found: error
          retention-days: 7

  test:
    needs: build
    if: needs.build.outputs.changed == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-latest, ubuntu-24.04-arm ]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Download repository
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: apt-repository
          path: site

      # adds the repository like users do, installs the oldest release and upgrades it to the newest one
      - name: Install and upgrade
        run: |
          python3 -m http.server --directory site --bind 127.0.0.1 8000 &
          # apt 3 (debian:13, ubuntu:26.04) verifies signatures with Sequoia and rejects weak keys
          for image in debian:12 debian:13 ubuntu:22.04 ubuntu:24.04 ubuntu:26.04; do
            echo "::group::$image"
            docker run --rm --network host -e APT_URL=http://127.0.0.1:8000/ \
              -v "$PWD/site:/site:ro" -v "$PWD/.github/scripts:/scripts:ro" \
              "$image" bash /scripts/test-repository.sh
            echo "::endgroup::"
          done
